name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.5"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Validate RBS
        run: bundle exec rbs validate

      - name: Run RuboCop
        run: bundle exec rubocop

      - uses: rubygems/release-gem@v1
